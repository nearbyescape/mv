name: T7Sonic isolated research foundation

# Do not check out or run the production tree as an executable strategy.
# Synthetic full-calendar source archives only; no VPS archives or network feeds.
on:
  push:
    branches:
      - codex/t7sonic-research
    paths:
      - .github/workflows/t7sonic-research.yml
      - services/api/app/research/t7sonic_*.py
      - services/api/tests/test_t7sonic_*.py
      - packages/contracts/t7sonic-research-v1.json
      - docs/T7SONIC_RESEARCH.md
      - services/t7sonic/Dockerfile.research
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/t7sonic-research.yml
      - services/api/app/research/t7sonic_*.py
      - services/api/tests/test_t7sonic_*.py
      - packages/contracts/t7sonic-research-v1.json
      - docs/T7SONIC_RESEARCH.md
      - services/t7sonic/Dockerfile.research
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t7sonic-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  causal-foundation:
    name: T7Sonic isolated causal market-perception tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/t7sonic-research') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/t7sonic-research') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'codex/t7sonic-research' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: services/api
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify research-only checkout and frozen production boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path("packages/contracts/t7sonic-research-v1.json").read_text())
          assert contract["strategy_family"] == "T7Sonic"
          assert contract["production_deployment_allowed"] is False
          assert contract["publication_enabled"] is False
          assert contract["live_order_execution_enabled"] is False
          assert contract["target_is_guarantee"] is False
          PY
          test ! -e /opt/mv-signal/app
          test ! -e /var/tmp/mv-v5-history-archives
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Fail closed if research PR changes production runtime paths
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base HEAD origin/main >/dev/null
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          from app.research.t7sonic_isolation import (
              validate_import_boundary, validate_dedicated_image, validate_change_scope
          )
          repo = Path.cwd()
          base = check_output(["git", "merge-base", "HEAD", "origin/main"], text=True).strip()
          changed = set(
              check_output(["git", "diff", "--name-only", "-z", base, "HEAD"])
              .decode().rstrip(chr(0)).split(chr(0))
          )
          changed.discard("")
          print(validate_change_scope(changed))
          print(validate_import_boundary(repo / "services/api/app/research"))
          print(validate_dedicated_image(repo))
          PY
      - name: Run offline, standard-library-only causal research checks
        run: |
          python -m unittest discover -s services/api/tests -p 'test_t7sonic_*.py' -v
      - name: Build and inspect T7Sonic-only standalone research container
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --pull=false -f services/t7sonic/Dockerfile.research \
            -t t7sonic-isolated-research-check:${{ github.sha }} .
          docker run --rm --pull never \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 40 --memory 256m \
            --user 10001:10001 \
            t7sonic-isolated-research-check:${{ github.sha }} \
            python -c '
          import importlib.util
          from pathlib import Path
          from app.research.t7sonic_isolation import validate_import_boundary
          root = Path("/opt/t7sonic")
          found = {p.name for p in root.rglob("*.py")}
          expected = {"t7sonic_cli.py","t7sonic_experts.py","t7sonic_perception.py",
                      "t7sonic_history.py","t7sonic_history_cli.py","t7sonic_isolation.py"}
          assert found == expected, (found,expected)
          assert sorted(root.rglob("*.json")) == [root / "contracts/t7sonic-research-v1.json"]
          assert importlib.util.find_spec("app.signals") is None
          assert importlib.util.find_spec("app.telegram") is None
          assert importlib.util.find_spec("app.market") is None
          assert importlib.util.find_spec("mv_strategy") is None
          assert importlib.util.find_spec("sqlalchemy") is None
          assert validate_import_boundary(root/"app/research")["production_strategy_runtime_imports"] == 0
          from app.research.t7sonic_experts import EXPERT_NAMES
          assert len(EXPERT_NAMES) == 6
          print("T7SONIC_ISOLATED_IMAGE_LEGACY_MODELS_ABSENT: PASS")
          '
      - name: Non-production conclusion
        if: success()
        run: |
          {
            echo '### T7Sonic causal snapshot research checks passed'
            echo 'Synthetic ZIP/manifest calendar validation only. No real signals or fills were backtested.'
            echo 'No VPS, exchanges, trading services, order APIs or historical validation accessed.'
            echo 'This is NOT evidence of accuracy or authorization to trade.'
          } >> "$GITHUB_STEP_SUMMARY"
