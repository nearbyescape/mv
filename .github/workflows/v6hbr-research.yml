name: V6HBR isolated research checks

# Repository-only regression checks.  VPS history ZIPs and production services
# are intentionally inaccessible to GitHub-hosted runners.
on:
  push:
    branches:
      - codex/mv-v6hbr-research
    paths:
      - .github/workflows/v6hbr-research.yml
      - services/api/app/research/**
      - services/api/tests/test_v6hbr_*.py
      - tools/v6hbr-*.sh
      - packages/strategy/**
      - packages/contracts/v5-history-v1.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/v6hbr-research.yml
      - services/api/app/research/**
      - services/api/tests/test_v6hbr_*.py
      - tools/v6hbr-*.sh
      - packages/strategy/**
      - packages/contracts/v5-history-v1.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v6hbr-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-unit:
    name: Read-only research regressions (no VPS)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/mv-v6hbr-research') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mv-v6hbr-research') ||
      (github.event_name == 'pull_request' &&
       github.head_ref == 'codex/mv-v6hbr-research' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout research branch without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify the exact approved research branch and frozen contract
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              test "${GITHUB_HEAD_REF}" = codex/mv-v6hbr-research ;;
            push|workflow_dispatch)
              test "${GITHUB_REF}" = refs/heads/codex/mv-v6hbr-research ;;
            *) exit 2 ;;
          esac
          printf '%s  %s\n' \
            48a460a42a1daf3349fe1b32af31154608dd2c6739cfca34eb14f3a5d1763d64 \
            packages/contracts/v5-history-v1.json | sha256sum -c -
          test ! -e /var/tmp/mv-v5-history-archives
          test ! -e /opt/mv-signal/app
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install pinned API and strategy dependencies
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install -e packages/strategy
      - name: Offline regression and operator safety checks
        working-directory: services/api
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/test_v6hbr_candidate_export.py \
            tests/test_v6hbr_execution_model.py \
            tests/test_v6hbr_portfolio_replay.py \
            tests/test_v6hbr_btc_pricing_pilot.py \
            tests/test_v6hbr_attribution.py \
            tests/test_v6hbr_decimal_reconciliation.py \
            tests/test_v6hbr_quality_diagnostics.py \
            tests/test_v6hbr_entry_adversity.py \
            tests/test_v6hbr_live_v4_forensics.py \
            tests/test_v6hbr_live_export_safety.py \
            tests/test_v6hbr_release_readiness.py \
            tests/test_v6hbr_math_abstention.py \
            tests/test_v6hbr_abstention_audit.py \
            tests/test_v6hbr_conservative_veto_stress.py \
            tests/test_v6hbr_directional_accuracy.py \
            tests/test_v6hbr_directional_development.py \
            tests/test_v6hbr_directional_preflight.py \
            tests/test_v6hbr_archive_queue.py \
            tests/test_v6hbr_time_cluster_forensics.py \
            tests/test_v6hbr_80pct_shadow.py \
            tests/test_v6hbr_chronological_probability.py \
            tests/test_v6hbr_candidate_operator_script.py \
            tests/test_v6hbr_btc_pricing_operator.py \
            tests/test_v6hbr_operator_pilots.py \
            tests/test_v6hbr_automation_bootstrap.py
      - name: Research-only summary
        if: success()
        shell: bash
        run: |
          {
            echo '### V6HBR offline checks passed'
            echo 'Only repository-contained regressions were tested.'
            echo 'No VPS archive files, live V4 services, Lighter fills,'
            echo 'August–September holdout, or historical P&L were accessed.'
            echo 'This does **not** certify trading profitability or authorize deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
