name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: mv
          POSTGRES_PASSWORD: ci-isolated-postgresql
          POSTGRES_DB: mv_checks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mv -d mv_checks"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e ../../packages/strategy
      - run: python -m pytest -q --ignore-glob='tests/test_t7sonic_*.py'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/api
          MV_TEST_PG_URL: postgresql+psycopg://mv:ci-isolated-postgresql@127.0.0.1:5432/mv_checks
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t mv-api-check .
      - run: docker run --rm mv-api-check python -m pytest -q --ignore-glob='tests/test_t7sonic_*.py'
      - run: docker run --rm mv-api-check python -m services.t7sonic.release_scheduler
      - run: docker run --rm --network none mv-api-check python -m app.v7sonic_sql_paper_worker
      - name: Syntax-check SHA-pinned VPS staging verification script
        run: bash -n deploy/v7sonic-verify-isolated.sh
      - name: Syntax-check operator-approved isolated real-data capture script
        run: bash -n deploy/v7sonic-capture-one-live-boundary.sh
      - name: Validate V7 isolated Compose under operator umask 077
        run: |
          umask 077
          V7_PREFLIGHT_IMAGE=mv-api-check docker compose --profile v7-private-diagnostics -f compose.v7sonic-isolated.yml config --format json > v7sonic-compose-normalized.json
          test "$(stat -c %a v7sonic-compose-normalized.json)" = 600
          # Only this uncredentialed preflight JSON is readable to the non-root container.
          chmod 0644 v7sonic-compose-normalized.json
          test "$(stat -c %a v7sonic-compose-normalized.json)" = 644
          docker run --rm --network none --read-only \
            -v "$PWD/v7sonic-compose-normalized.json:/tmp/v7sonic-compose-normalized.json:ro" \
            mv-api-check python -m app.v7sonic_compose_guard /tmp/v7sonic-compose-normalized.json
      - name: V7 isolated preflight with no network, DB, Telegram or V4 runtime
        run: |
          V7_PREFLIGHT_IMAGE=mv-api-check docker compose --profile v7-private-diagnostics -f compose.v7sonic-isolated.yml run --rm --no-deps v7-preflight
      - run: docker build -f services/api/Dockerfile.daily-report -t mv-report-check .
      - run: |
          docker run --rm mv-report-check python -c \
            "from pathlib import Path; from app.telegram.daily_report import STATE_DIR, open_ledger; open_ledger(); assert Path(STATE_DIR / 'daily-reports.sqlite3').is_file(); print('Isolated ledger smoke: PASS')"
      - run: docker build -f apps/web/Dockerfile -t mv-web-check .

  v7sonic:
    name: V7Sonic complete isolated regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/services/api:${{ github.workspace }}/services/api/tests
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install API SQL and application dependencies for V7 integration tests
        run: |
          python -m pip install -r services/api/requirements.txt
          python -m pip install -e packages/strategy
      - name: All causal/source/strategy/portfolio tests
        run: python -m unittest discover -s services/api/tests -p 'test_t7sonic_*.py' -q
      - name: Release adapter, scheduler and isolated SQL persistence tests
        run: python -m unittest discover -s services/api/tests -p 'test_v7sonic_*.py' -q
      - name: Scheduler preflight with no network
        run: python -m services.t7sonic.release_scheduler
