name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: mv
          POSTGRES_PASSWORD: ci-isolated-postgresql
          POSTGRES_DB: mv_checks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mv -d mv_checks"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e ../../packages/strategy
      - run: python -m pytest -q
        env:
          MV_TEST_PG_URL: postgresql+psycopg://mv:ci-isolated-postgresql@127.0.0.1:5432/mv_checks
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t mv-api-check .
      - run: docker run --rm mv-api-check python -m pytest -q
      - run: docker build -f apps/web/Dockerfile -t mv-web-check .
