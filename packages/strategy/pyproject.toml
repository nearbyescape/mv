[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mv-strategy"
version = "0.3.0"
requires-python = ">=3.12"
description = "Deterministic Decimal market indicators for MV Signal"

[tool.setuptools.packages.find]
where = ["."]
include = ["mv_strategy*"]
