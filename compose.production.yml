name: mv-signal
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
x-backend: &backend
  image: mv-signal-api:0.10.0
  build: { context: ., dockerfile: services/api/Dockerfile }
  environment: &backend-env
    MV_ENVIRONMENT: production
    MV_AUTH_REQUIRED: "true"
    MV_PUBLIC_ORIGIN: ${MV_PUBLIC_ORIGIN:-https://mv.jaleshwarima.com}
    MV_DATABASE_URL_FILE: /run/secrets/database_url
    MV_SERVICE_KEY_FILE: /run/secrets/service_key
    MV_PAPER_ENABLED: "false"
    MV_SESSION_HOURS: "12"
    MV_SIGNAL_SESSION_ENABLED: "true"
    MV_MAINTENANCE: ${MV_MAINTENANCE:-false}
  secrets: [database_url, service_key]
  init: true
  restart: unless-stopped
  logging: *logging
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 512m

services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mv_signal
      POSTGRES_PASSWORD_FILE: /run/secrets/database_admin_password
    secrets: [database_password, database_admin_password]
    volumes:
      [
        database:/var/lib/postgresql,
        "./deploy/init-database.sh:/docker-entrypoint-initdb.d/01-mv.sh:ro",
      ]
    restart: unless-stopped
    logging: *logging
    shm_size: 128m
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d mv_signal"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    <<: *backend
    command: [python, -m, alembic, upgrade, head]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *backend
    environment:
      <<: *backend-env
      MV_BACKUP_STATUS_FILE: /backup-status/last-success.json
    volumes: ["backup-status:/backup-status:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  collector:
    <<: *backend
    command: [python, -m, app.market.collector]
    depends_on:
      api: { condition: service_healthy }
  engine:
    <<: *backend
    command: [python, -m, app.signals.worker]
    depends_on:
      api: { condition: service_healthy }
  delivery:
    <<: *backend
    command: [python, -m, app.operations.worker]
    depends_on:
      api: { condition: service_healthy }
  web:
    image: mv-signal-web:0.10.0
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      MV_ENVIRONMENT: production
      MV_AUTH_REQUIRED: "true"
      MV_PUBLIC_ORIGIN: ${MV_PUBLIC_ORIGIN:-https://mv.jaleshwarima.com}
      MV_API_URL: http://api:8000
      MV_SERVICE_KEY_FILE: /run/secrets/service_key
    secrets: [service_key]
    init: true
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3100/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
  gateway:
    image: caddy:2-alpine@sha256:881bbc60f9986d5ab8e7cfd6cf7e4ef3c9c0439fef2429d035d065577882f028
    environment:
      MV_SITE: ${MV_SITE:-mv.jaleshwarima.com}
      MV_OWNER_EMAIL: ${MV_OWNER_EMAIL:?Set the owner email in deploy/production.env}
    ports: ["80:80", "443:443"]
    volumes:
      [
        "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro",
        "caddy-data:/data",
        "caddy-config:/config",
      ]
    depends_on:
      web: { condition: service_healthy }
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
  backup:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    entrypoint: [sh, /backup-loop.sh]
    secrets: [database_password]
    volumes:
      [
        "./deploy/backup-loop.sh:/backup-loop.sh:ro",
        "./deploy/backups:/backups",
        "backup-status:/backup-status",
      ]
    restart: unless-stopped
    logging: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 256m
    depends_on:
      migrate: { condition: service_completed_successfully }

secrets:
  database_password: { file: ./deploy/secrets/database_password }
  database_admin_password: { file: ./deploy/secrets/database_admin_password }
  database_url: { file: ./deploy/secrets/database_url }
  service_key: { file: ./deploy/secrets/service_key }
volumes:
  backup-status:
  database:
  caddy-data:
  caddy-config:
