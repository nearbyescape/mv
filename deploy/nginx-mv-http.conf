server {
    listen 80;
    listen [::]:80;
    server_name mv.jaleshwarima.com;
    access_log /var/log/nginx/mv-signal.access.log;
    error_log /var/log/nginx/mv-signal.error.log;
    client_max_body_size 64k;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/mv-signal/acme;
        try_files $uri =404;
    }
    location / { return 503; }
}
