server {
    listen 80;
    listen [::]:80;
    server_name mv.jaleshwarima.com;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/mv-signal/acme;
        try_files $uri =404;
    }
    location / { return 301 https://mv.jaleshwarima.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mv.jaleshwarima.com;
    ssl_certificate /opt/mv-signal/tls/live/mv.jaleshwarima.com/fullchain.pem;
    ssl_certificate_key /opt/mv-signal/tls/live/mv.jaleshwarima.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MVSignalSSL:10m;
    ssl_session_timeout 1d;
    access_log /var/log/nginx/mv-signal.access.log;
    error_log /var/log/nginx/mv-signal.error.log;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:43100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-MV-Client-IP $remote_addr;
        proxy_set_header X-MV-Service-Key "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
